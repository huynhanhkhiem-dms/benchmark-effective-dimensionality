name: Pre-submission PCARE certificate falsification
on:
  push:
    branches: ['research/rank-transfer-audit-*']
    paths: ['analysis/pcare_certificate_falsification.py', '.github/workflows/pcare_falsification.yml']
  workflow_dispatch:
jobs:
  falsification:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r analysis/requirements.txt
      - run: python analysis/pcare_certificate_falsification.py
      - name: Archive bounded regret study outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/pcare_certificate_falsification_20261008.json
          git commit -m "Record conditional regret certificate falsification outcomes" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcare-certificate-results
          path: results/pcare_certificate_falsification_20261008.json
