name: Reproduce reported CC18 analyses
on:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'data/**'
      - 'results/**'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Reproduce original spectra
        run: python analysis/reproduce_results.py
      - name: Reproduce disjoint-portfolio manuscript results
        run: python analysis/reproduce_submission.py --repo . --reference results/reference_20261008.json --output recomputed_submission_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-results
          path: |
            recomputed_submission_results.json
            public_reproduction_check.json
