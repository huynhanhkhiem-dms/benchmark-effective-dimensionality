name: TabZilla independent-score validation
on:
  push:
    branches:
      - 'research/rank-transfer-audit-*'
    paths:
      - 'analysis/tabzilla_validation.py'
      - '.github/workflows/tabzilla_validation.yml'
  workflow_dispatch:
jobs:
  validate-score-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r analysis/requirements.txt
          python -m pip install scipy
      - name: External score-source validation
        run: python analysis/tabzilla_validation.py
      - name: Commit validation outputs to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/tabzilla_validation_20261008.json
          git commit -m "Record independent-published-score validation" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabzilla-validation-results
          path: results/tabzilla_validation_20261008.json
