name: Exploratory rank transfer audit
on:
  push:
    branches:
      - 'research/rank-transfer-audit-*'
    paths:
      - 'analysis/rank_transfer_audit.py'
      - '.github/workflows/rank_transfer_audit.yml'
  workflow_dispatch:

jobs:
  rank-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-scientific-stack compatible dependencies
        run: |
          python -m pip install -r analysis/requirements.txt
          python -m pip install scipy
      - name: Execute ranked decision-outcome experiments
        run: python analysis/rank_transfer_audit.py
      - name: Commit exploratory outputs to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/rank_transfer_audit_20261008.json
          git commit -m "Record exploratory rank transfer results" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-transfer-results
          path: results/rank_transfer_audit_20261008.json
